<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>局中 · 今晚体验邀请</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c2a24;background:#f4f1e9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px}main{width:min(540px,100%)}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}.mark{width:36px;height:36px;background:#172c26;border-radius:50%;display:grid;place-items:center}.mark:after{content:"";width:13px;height:13px;background:#d6f267;transform:rotate(45deg);border-radius:2px}.eyebrow{font-size:12px;letter-spacing:2px;color:#647168;margin:50px 0 18px}h1{font-size:clamp(36px,8vw,54px);line-height:1.3;letter-spacing:-2px;margin:0}p{font-size:15px;line-height:1.9;color:#647168}.card{margin-top:32px;padding:25px;background:#172c26;border-radius:12px;color:#fffef9}.card p{color:#c7d3bd;margin:0 0 20px;font-size:14px}a{display:flex;align-items:center;justify-content:space-between;color:#172c26;background:#d6f267;border-radius:7px;padding:16px 20px;text-decoration:none;font-weight:650}a:focus-visible{outline:3px solid #fff;outline-offset:4px}small{display:block;margin-top:18px;font-size:12px;line-height:1.8;color:#647168}.date{font-variant-numeric:tabular-nums}#status{min-height:27px}footer{border-top:1px solid #d8dcd1;margin-top:36px;padding-top:20px;font-size:12px;line-height:1.8;color:#647168}
</style>
</head>
<body><main>
<div class="brand"><span class="mark" aria-hidden="true"></span>局中 <span style="font-size:12px;font-weight:400;color:#647168">反诈体验室</span></div>
<p class="eyebrow">TONIGHT'S INVITATION / 今晚体验邀请</p>
<h1>看似合理，<br>未必可信。</h1>
<p>一位退费协调员找到了你。<br>进入对话，查阅材料，做出自己的判断。</p>
<div class="card"><p id="status" role="status">正在准备你的体验入口…</p><a id="enter" href="https://carpet-granted-daily-specialty.trycloudflare.com/" rel="noreferrer">进入体验<span aria-hidden="true">↗</span></a></div>
<small>本次开放至 <span class="date">2026-09-28 23:59（北京时间）</span>。临时体验需要发起人保持电脑开机联网。</small>
<footer>人物、机构与交易均为虚构。请勿输入真实个人或支付信息。</footer>
</main><script>
(() => {
  const origin = 'https://carpet-granted-daily-specialty.trycloudflare.com';
  const expiresAt = 1790611140000;
  const status = document.getElementById('status');
  const enter = document.getElementById('enter');
  if (Date.now() >= expiresAt) {
    status.textContent = '今晚的体验已结束，感谢参与。';
    enter.remove();
    return;
  }
  const invite = new URLSearchParams(location.hash.slice(1)).get('invite');
  const destination = new URL(origin);
  if (invite && /^[A-Za-z0-9_-]{24,128}$/.test(invite)) {
    destination.hash = 'invite=' + encodeURIComponent(invite);
    enter.href = destination.href;
    status.textContent = '邀请已就绪，正在进入体验…';
    location.replace(destination.href);
  } else {
    status.textContent = '请使用好友发给你的完整邀请链接，或进入后填写邀请码。';
  }
})();
</script></body></html>
